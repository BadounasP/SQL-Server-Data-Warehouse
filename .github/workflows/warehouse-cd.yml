# Versioned software delivery for the warehouse's custom Airflow + dbt runtime.
# This workflow does NOT connect to SQL Server or deploy to local Docker.
# It publishes only release tags after the existing CI suite passes again.
name: Warehouse CD

on:
  push:
    tags:
      - 'v*'

# The reusable CI workflow needs only read access.
permissions:
  contents: read

concurrency:
  group: warehouse-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release via existing Warehouse CI
    uses: ./.github/workflows/warehouse-ci.yml
    permissions:
      contents: read

  publish-image:
    name: Publish versioned Airflow + dbt image to GHCR
    needs: validate-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify release tag and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release tag must use vMAJOR.MINOR.PATCH, e.g. v1.0.0.' >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo 'Release tag must point to a commit on main.' >&2
            exit 1
          fi

      - name: Prepare lower-case GHCR image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate version and commit tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=SQL Server Warehouse Airflow + dbt runtime
            org.opencontainers.image.description=Versioned Airflow 3.4 + dbt-sqlserver image for the warehouse

      - name: Build and publish the Airflow + dbt image
        uses: docker/build-push-action@v7
        with:
          context: ./orchestration/airflow
          file: ./orchestration/airflow/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify released image is available in GHCR
        shell: bash
        run: |
          docker buildx imagetools inspect "${{ steps.image.outputs.name }}:${GITHUB_REF_NAME}"

      - name: Smoke-test dbt inside the published image
        shell: bash
        run: |
          docker run --rm --pull=always \
            --entrypoint /opt/dbt-venv/bin/dbt \
            "${{ steps.image.outputs.name }}:${GITHUB_REF_NAME}" --version
