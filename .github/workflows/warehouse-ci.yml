# GitHub-hosted CI for the local SQL Server + dbt + Airflow warehouse.
# This workflow does NOT contact the local SQL Server or deploy to the PC.
name: Warehouse CI

on:
  # Validate normal code changes on main and pull requests.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Allow the release workflow to re-run the same checks before publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: warehouse-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Python, YAML and repository structure
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install YAML parser
        run: python -m pip install 'PyYAML>=6,<7'

      - name: Check project layout, Python syntax and YAML
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          import yaml

          root = Path.cwd()
          dag_dir = root / 'orchestration' / 'airflow' / 'dags'
          dbt_project = root / 'data_warehouse_dbt' / 'dbt_project.yml'
          dockerfile = root / 'orchestration' / 'airflow' / 'Dockerfile'

          for item in (dag_dir, dbt_project, dockerfile):
              if not item.exists():
                  raise SystemExit(f'Missing expected project path: {item.relative_to(root)}')

          dag_files = sorted(dag_dir.glob('*.py'))
          if not dag_files:
              raise SystemExit('No Airflow DAG files found.')

          for path in dag_files:
              ast.parse(path.read_text(encoding='utf-8-sig'), filename=str(path))
              print(f'Python syntax OK: {path.relative_to(root)}')

          config_paths = [
              dbt_project,
              root / 'orchestration' / 'airflow' / 'docker-compose.yaml',
              root / 'orchestration' / 'airflow' / 'compose.override.yaml',
          ]
          config_paths.extend(sorted((root / 'data_warehouse_dbt' / 'models').rglob('*.yml')))
          config_paths.extend(sorted((root / 'data_warehouse_dbt' / 'models').rglob('*.yaml')))
          for path in config_paths:
              if path.is_file():
                  with path.open(encoding='utf-8-sig') as stream:
                      yaml.safe_load(stream)
                  print(f'YAML syntax OK: {path.relative_to(root)}')
          PY

      - name: Reject accidentally tracked local secrets
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import PurePosixPath
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          forbidden = []
          for name in filter(None, paths):
              path = PurePosixPath(name)
              if path.name in {'.env', 'profiles.yml'} or '.venv' in path.parts:
                  forbidden.append(name)
          if forbidden:
              raise SystemExit('Remove local credentials / virtual environments from Git tracking:\n' + '\n'.join(forbidden))
          print('No .env, profiles.yml, or .venv files tracked.')
          PY

  dbt-parse:
    name: dbt offline project validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dbt SQL Server adapter and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y unixodbc-dev
          python -m pip install 'dbt-sqlserver[pyodbc]==1.12.2' 'PyYAML>=6,<7'

      - name: Create disposable offline dbt profile
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml
          project_file = Path('data_warehouse_dbt/dbt_project.yml')
          project = yaml.safe_load(project_file.read_text(encoding='utf-8-sig'))
          profile_name = project.get('profile') or project['name']
          # Placeholder connection values are intentionally unusable.
          # `dbt parse` checks model/project structure without querying SQL Server.
          profile = {
              profile_name: {
                  'target': 'dev',
                  'outputs': {
                      'dev': {
                          'type': 'sqlserver',
                          'driver': 'ODBC Driver 18 for SQL Server',
                          'server': '127.0.0.1',
                          'port': 14333,
                          'database': 'DataWarehouse',
                          'schema': 'dbt_dev',
                          'user': 'ci_placeholder',
                          'password': 'ci_placeholder',
                          'encrypt': True,
                          'trust_cert': True,
                          'threads': 2,
                      }
                  }
              }
          }
          destination = Path(os.environ['RUNNER_TEMP']) / 'warehouse_dbt_profiles'
          destination.mkdir(parents=True, exist_ok=True)
          (destination / 'profiles.yml').write_text(
              yaml.safe_dump(profile, sort_keys=False), encoding='utf-8'
          )
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as env:
              env.write(f'DBT_PROFILES_DIR={destination}\n')
          print('Created a temporary dbt profile with dummy credentials.')
          PY

      - name: Install dbt packages if declared
        shell: bash
        run: |
          if [ -f data_warehouse_dbt/packages.yml ]; then
            dbt deps --project-dir data_warehouse_dbt
          fi

      - name: Parse dbt models and tests without connecting to SQL Server
        run: dbt parse --project-dir data_warehouse_dbt --no-partial-parse

  docker-build:
    name: Build Airflow + dbt container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build Docker image (do not publish)
        uses: docker/build-push-action@v7
        with:
          context: ./orchestration/airflow
          file: ./orchestration/airflow/Dockerfile
          push: false
          tags: warehouse-airflow:ci
