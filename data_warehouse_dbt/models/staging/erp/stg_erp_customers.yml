version: 2

models:
  - name: stg_erp_customers
    description: >
      Standardized ERP customer demographic records,
      including customer identifiers, birthdates,
      and gender values.

    columns:
      - name: cid
        description: >
          Customer identifier standardized by removing
          the NAS prefix when present.
        data_tests:
          - not_null

      - name: gen
        description: "Standardized customer gender."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Female', 'Male', 'n/a']
