version: 2

models:
  - name: stg_crm_customers
    description: >
      Cleaned and deduplicated customer records
      sourced from the CRM Bronze layer.

    columns:
      - name: cst_id
        description: "Unique CRM customer identifier."
        data_tests:
          - unique
          - not_null

      - name: cst_marital_status
        description: "Standardized marital status."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Single', 'Married', 'n/a']

      - name: cst_gndr
        description: "Standardized customer gender."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Female', 'Male', 'n/a']
